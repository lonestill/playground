<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:s="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <title id="p5-title">probe5 namespaces</title>
  <rect id="p5-bg" x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text id="p5-start" x="10" y="24" font-size="16" fill="#000">P5 START</text>

  <script xmlns="http://www.w3.org/2000/svg" id="p5-default-script">alert('P5_DEFAULT_SCRIPT')</script>

  <a id="p5-default-a" href="javascript:alert('P5_DEFAULT_A')"><text x="10" y="56" font-size="13">01 default-ns a javascript</text></a>

  <s:script id="p5-prefixed-script">alert('P5_PREFIXED_SCRIPT')</s:script>

  <s:a id="p5-prefixed-a" href="javascript:alert('P5_PREFIXED_A')"><s:text x="10" y="84" font-size="13" fill="#000">02 prefixed a javascript</s:text></s:a>
  <s:a id="p5-prefixed-xlink" xlink:href="javascript:alert('P5_PREFIXED_XLINK')"><s:text x="10" y="108" font-size="13" fill="#000">03 prefixed a xlink javascript</s:text></s:a>

  <s:image id="p5-prefixed-image" href="javascript:alert('P5_PREFIXED_IMAGE')" x="10" y="130" width="20" height="20"/>
  <s:use id="p5-prefixed-use" href="javascript:alert('P5_PREFIXED_USE')" x="40" y="130"/>
  <s:animate id="p5-prefixed-animate" attributeName="href" values="https://example.com/;javascript:alert('P5_PREFIXED_ANIM')" begin="0s" dur="0.1s" fill="freeze"/>

  <s:foreignObject id="p5-prefixed-fo" x="10" y="160" width="220" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <img src="x" onerror="alert('P5_PREFIXED_FO')" />
      <p>P5 FO</p>
    </div>
  </s:foreignObject>

  <s:a id="p5-prefixed-anim-a" href="https://example.com/p5-before">
    <s:text x="10" y="260" font-size="13" fill="#000">04 prefixed animated a</s:text>
    <s:set attributeName="href" to="javascript:alert('P5_PREFIXED_SET')" begin="0s"/>
  </s:a>

  <text id="p5-end" x="10" y="310" font-size="16" fill="#000">P5 END</text>
  <rect id="p5-end-box" x="10" y="330" width="140" height="34" fill="#eee" stroke="#000"/>
  <text id="p5-end-label" x="18" y="352" font-size="12" fill="#000">P5-END-BOX</text>
</svg>
